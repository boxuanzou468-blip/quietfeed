name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('The tag must match the version in package.json.');
          }
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release
      - name: Retain release packages
        uses: actions/upload-artifact@v4
        with:
          name: quietfeed-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --title "QuietFeed $GITHUB_REF_NAME" --generate-notes
          fi
