name: 功能建议
description: 描述你想完成的事情及当前遇到的阻碍。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 你在什么场景下遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的处理办法
      description: 可选。请避免提交账号或私人内容。
