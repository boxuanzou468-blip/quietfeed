<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>知乎问题结构测试（合成）</title>
  </head>
  <body>
    <header class="AppHeader">
      <div class="SearchBar"><input class="SearchBar-input" aria-label="搜索" /></div>
    </header>
    <section class="QuestionHeader">
      <h1>合成问题标题</h1>
      <div class="QuestionRichText">合成问题描述</div>
    </section>
    <main class="Question-main">
      <section class="Question-mainColumn">
        <article class="AnswerItem">
          <div class="RichContent">合成回答正文</div>
          <button>收藏</button>
        </article>
        <div class="CommentsV2">
          <div class="CommentListV2">合成评论</div>
          <textarea class="CommentEditorV2" aria-label="评论"></textarea>
        </div>
      </section>
      <aside class="Question-sideColumn">
        <section class="RelatedQuestions">
          <h2>合成相关问题</h2>
          <a href="/question/456">合成相关条目</a>
        </section>
        <section class="QuestionRelatedTopic"><h2>合成相关话题</h2></section>
        <section class="question-stats">问题统计（保留）</section>
        <section class="creator-entry">作者入口（保留）</section>
      </aside>
    </main>
  </body>
</html>
