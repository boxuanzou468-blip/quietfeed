<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CSDN homepage structural fixture</title>
  </head>
  <body>
    <!-- Synthetic text; only the public homepage module structure is reproduced. -->
    <header id="csdn-toolbar">
      <input id="toolbar-search-input" placeholder="搜CSDN" value="用户输入" />
      <button id="toolbar-search-button">搜索</button>
      <div id="csdn-toolbar-profile-nologin"><button>登录</button></div>
    </header>
    <aside class="layout-sidebar-aside">
      <a href="/follow">关注</a><a href="/favorites">收藏</a><a href="/history">历史</a>
    </aside>
    <main>
      <div id="home-content-box" class="home-content-box">
        <div class="home-info">
          <div class="home-cont-title active">资讯头条</div>
          <div class="home-info-banner">
            <a id="banner-box" href="/article/example">资讯轮播</a>
            <a id="banner-box" data-fixture-ad href="/promotion/example">
              <div id="kp_box_987"><iframe title="原站广告嵌入"></iframe></div>
            </a>
          </div>
          <div class="home-info-headlines">资讯头条</div>
        </div>
        <div class="home-project"><div class="home-project-cont">推荐开源项目</div></div>
        <div class="home-article"><div class="home-article-cont">精选博客</div></div>
      </div>
      <div id="home_box_right" class="home_box_right www-home-right">
        <div id="www-home-silde" class="www-home-silde">
          <div id="kp_box_www_swiper" class="broadcast-active kp_bos_swiper">
            广告
            <div id="kp_box_585"><iframe title="原站侧栏广告"></iframe></div>
          </div>
          <div class="ContentBlock slide-box">社区推荐</div>
          <div class="broadcast slide-box">直播推荐</div>
          <div class="calendar slide-box">活动日历</div>
          <div class="member slide-box">精品课程</div>
        </div>
      </div>
    </main>
  </body>
</html>
